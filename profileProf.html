<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Professor Profile | CCDI EDU</title>
	<link rel="stylesheet" href="style.css">
</head>
<body data-page="profile" data-role="professor">
	<div id="toast" class="toast"></div>
	<section id="appPage" class="app-page">
		<header class="app-topbar"><button class="mobile-menu" onclick="toggleSidebar()" aria-label="Open navigation">☰</button><a class="brand" href="dashboard-professor.html"><img class="brand-logo" src="image/CCDI EDU.png" alt="CCDI EDU"><div><strong>CCDI EDU</strong><small>Computer Communication Development Institute</small></div></a><a class="btn btn-light" href="dashboard-professor.html">Back</a></header>
	
		
	</section>
	<div class="app-content static-page-content" id="profileTemplate"><section class="page-title"><div><span class="eyebrow">FACULTY ACCOUNT</span><h1>My Profile</h1><p>Personal information and assigned classes.</p></div></section>
		<div class="profile-grid"><div class="panel profile-card"><div class="big-avatar">PR</div><h2 data-profile-name></h2><p class="muted">Professor</p><div class="profile-id"><small>CCDI ID</small><strong data-profile-value="ccdiId">Loading...</strong></div><button class="btn btn-outline" type="button" onclick="logout()">Log out</button></div>
			<div class="profile-information"><div class="panel"><div class="panel-head"><h2>Personal Information</h2><button class="btn btn-primary" type="button" onclick="saveProfile()">Save Changes</button></div><div class="form-grid"><div class="form-group"><label>First Name</label><input data-profile-value="firstName" readonly></div><div class="form-group"><label>Middle Name</label><input data-profile-field="middleName"></div><div class="form-group"><label>Last Name</label><input data-profile-value="lastName" readonly></div><div class="form-group"><label>Birthday</label><input data-profile-value="birthday" readonly></div><div class="form-group"><label>Civil Status</label><input data-profile-field="civilStatus"></div><div class="form-group"><label>Email</label><input type="email" data-profile-field="email" required></div><div class="form-group"><label>Phone Number</label><input data-profile-field="phone" required></div><div class="form-group"><label>Employment Status</label><input data-profile-value="employmentStatus" readonly></div><div class="form-group full-row"><label>Address</label><textarea data-profile-field="address" required></textarea></div></div></div>
				<div class="panel"><div class="panel-head"><h2>Assigned Classes and Subjects</h2></div><div class="table-wrap"><table><thead><tr><th>Course</th><th>Year</th><th>Block</th><th>Subject</th></tr></thead><tbody data-assigned-classes><tr><td colspan="4" class="muted">Loading assignments...</td></tr></tbody></table></div></div>
			</div>
		</div>
	</div>
	<script src="script.js" defer></script>
</body>
</html>
