<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professor Registration | CCDI EDU</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast" class="toast"></div>
  <main class="registration-page">
    <a class="brand registration-brand" href="index.html"><img class="brand-logo" src="image/CCDI EDU.png" alt="CCDI EDU"><div><strong>CCDI EDU</strong><small>Computer Communication Development Institute</small></div></a>
    <section class="panel registration-panel">
      <div class="page-title"><div><span class="eyebrow">FACULTY ACCOUNT</span><h1>Professor registration</h1><p class="muted">A valid invitation from a CCDI administrator is required.</p></div></div>
      <form id="professorInviteCheckForm"><div class="form-group"><label for="professorInviteCode">Invitation code</label><input id="professorInviteCode" required maxlength="100" autocomplete="one-time-code"></div><button class="btn btn-primary" type="submit">Verify invitation</button></form>
      <form id="professorRegistrationForm" class="hidden">
        <input id="verifiedProfessorInvite" type="hidden">
        <div class="form-grid">
          <div class="form-group"><label for="professorFirstName">First name</label><input id="professorFirstName" required maxlength="100" autocomplete="given-name"></div>
          <div class="form-group"><label for="professorLastName">Last name</label><input id="professorLastName" required maxlength="100" autocomplete="family-name"></div>
          <div class="form-group"><label for="professorMiddleName">Middle name (optional)</label><input id="professorMiddleName" maxlength="100" autocomplete="additional-name"></div>
          <div class="form-group"><label for="professorBirthday">Birthday</label><input id="professorBirthday" type="date" required></div>
          <div class="form-group"><label for="professorCivilStatus">Civil status</label><input id="professorCivilStatus" maxlength="40"></div>
          <div class="form-group"><label for="professorEmail">Email</label><input id="professorEmail" type="email" required maxlength="255" autocomplete="email"></div>
          <div class="form-group"><label for="professorPhone">Phone number</label><input id="professorPhone" type="tel" required maxlength="40" autocomplete="tel"></div>
          <div class="form-group full-row"><label for="professorAddress">Complete address</label><textarea id="professorAddress" required maxlength="500" autocomplete="street-address"></textarea></div>
          <div class="form-group"><label for="professorPassword">Password</label><input id="professorPassword" type="password" required minlength="8" autocomplete="new-password"></div>
          <div class="form-group"><label for="professorPasswordConfirm">Confirm password</label><input id="professorPasswordConfirm" type="password" required minlength="8" autocomplete="new-password"></div>
        </div>
        <button class="btn btn-primary" type="submit">Create professor account</button>
      </form>
      <p class="registration-footer"><a class="text-link" href="index.html">Return to sign in</a></p>
    </section>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
